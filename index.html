<!DOCTYPE html>
<html>
 <head>
<meta charset="utf-8">
<title>Currency Rate Checker</title>
<link rel="stylesheet" href="style.css">
 </head>   
 <body>
  <h1> Currency Rate Checker</h1>
  <input id="amt" type="number" value="1">
  <select id="base"></select>  
   <select id="q" placeholder="Search e.g RWF">
    <select id="sort"><option value="1">Rate high to low</option><option value="-1">Rate low to high</option></select>
    <p id="'msg"></p>
    <table id="t"></table>
    <footer>Rates by <a href="https://www.exchangerate-api.com">ExchangeRate-API</a></footer>
    <script src="script.js"></script>
 </body>
</html>
